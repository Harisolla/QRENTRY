services:
  - type: web
    name: qrentry
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn event_system.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: qrentry-db
          property: connectionString

databases:
  - name: qrentry-db
    plan: free
