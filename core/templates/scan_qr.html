{% extends 'base.html' %}
{% block title %}Scan QR Code{% endblock %}

{% block content %}
<section class="qr-scan-shell">
  <div class="qr-scan-card">
    <h2>Scan Ticket QR Code</h2>
    <div id="reader"></div>
    <div class="qr-result" id="resultMsg"></div>
  </div>
</section>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
function handleScanSuccess(ticketId) {
  fetch(`/api/attend/${ticketId}/`)
    .then(response => response.json())
    .then(data => {
      const msg = document.getElementById("resultMsg");
      if (data.success) {
        msg.innerHTML = `Attendance marked for Ticket ID: <b>${ticketId}</b>`;
        msg.className = "qr-result success";
      } else {
        msg.innerHTML = data.error;
        msg.className = "qr-result fail";
      }
    });
}

const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  (decodedText) => {
    html5QrCode.stop();
    handleScanSuccess(decodedText);
  },
  () => {}
).catch(() => {
  document.getElementById("resultMsg").innerText = "Camera access denied or an error occurred.";
  document.getElementById("resultMsg").className = "qr-result fail";
});
</script>
{% endblock %}
