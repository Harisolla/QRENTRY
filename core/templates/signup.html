{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up - QrEntry{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="auth-card" data-aos="zoom-in">
          <div class="text-center mb-4">
            <h2 class="auth-title">Create Your Account</h2>
            <p class="auth-subtitle">Join <span class="fw-bold text-info">QrEntry</span> and explore amazing events.</p>
          </div>

          <form method="post" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
            </div>

            <div class="mb-3">
              <input type="email" class="form-control" id="email" name="email" placeholder="Email address" required>
            </div>

            <div class="mb-3">
              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="mb-4">
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
            </div>

            <div class="mb-4">
              <label for="role" class="form-label text-white fw-semibold">Register as</label>
              <select class="form-select" id="role" name="role" required>
                <option value="" selected disabled>Choose a role...</option>
                <option value="organiser">Organiser</option>
                <option value="participant">Participant</option>
              </select>
            </div>

            <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold">Sign Up</button>
          </form>

          <div class="text-center mt-4">
            <small class="text-white-50">Already have an account?
              <a href="{% url 'login' %}" class="auth-inline-link">Login</a>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
