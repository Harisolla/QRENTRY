{% extends 'base.html' %}
{% load static %}
{% block title %}{{ event.name }} - Details{% endblock %}

{% block content %}
<div class="event-detail-shell" style="--event-bg: linear-gradient(rgba(7, 20, 40, 0.5), rgba(6, 14, 30, 0.82)), url('{% if event.image %}{{ event.image.url }}{% else %}{% static 'images/event_creation.png' %}{% endif %}') center/cover no-repeat;">
  <a href="{% url 'event_list' %}" class="event-back-link"><i class="bi bi-arrow-left"></i> Back to Events</a>

  <h2 class="event-title">{{ event.name }}</h2>
  <p class="event-desc">{{ event.description }}</p>

  <div class="event-meta-grid">
    <div>
      <strong><i class="bi bi-geo-alt-fill me-1"></i> Venue</strong>
      {{ event.location }}
    </div>
    <div>
      <strong><i class="bi bi-calendar-date-fill me-1"></i> Date</strong>
      {{ event.date }}
    </div>
    <div>
      <strong><i class="bi bi-cash-coin me-1"></i> Price</strong>
      INR {{ event.price }}
    </div>
  </div>

  <form method="GET" action="{% url 'fake_payment' event.id %}">
    <button type="submit" class="btn btn-gradient event-book-btn">Book Ticket</button>
  </form>
</div>
{% endblock %}
