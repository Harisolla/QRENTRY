{% extends 'base.html' %}
{% load static %}
{% block title %}Set New Password - QrEntry{% endblock %}

{% block content %}
<section class="auth-shell auth-shell--compact">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-4">
        <div class="auth-card shadow-lg" data-aos="fade-up">
          <div class="text-center mb-4">
            <h2 class="auth-title">Set New Password</h2>
          </div>

          <form method="post" class="reset-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold">Reset Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
