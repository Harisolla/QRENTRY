{% extends 'base.html' %}
{% block title %}Payment Page{% endblock %}

{% block content %}
<section class="payment-shell">
  <div class="payment-card">
    <h2>Payment for {{ event.name }}</h2>
    <p class="lead">Amount: INR {{ event.price }}</p>

    <form method="POST" id="payment-form">
      {% csrf_token %}
      <button class="btn btn-gradient btn-lg" id="pay-btn">Pay Now</button>
    </form>

    <div class="payment-spinner" id="spinner"></div>
    <div class="payment-processing-text" id="processing-text">Processing payment, please wait...</div>
  </div>
</section>

<script>
document.getElementById("payment-form").addEventListener("submit", function(){
  document.getElementById("spinner").style.display = "block";
  document.getElementById("processing-text").style.display = "block";
  document.getElementById("pay-btn").disabled = true;
});
</script>
{% endblock %}
