{% extends 'base.html' %}
{% load static %}
{% block title %}Password Reset Complete - QrEntry{% endblock %}

{% block content %}
<section class="auth-shell auth-shell--compact">
  <div class="container">
    <div class="auth-message-card text-center mx-auto">
      <h2 class="auth-title">Password Reset Successful</h2>
      <p class="auth-subtitle mb-4">Your password has been updated. You can now log in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-gradient">Login</a>
    </div>
  </div>
</section>
{% endblock %}
