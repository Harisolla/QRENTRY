{% extends 'base.html' %}
{% load static %}
{% block title %}Mark Attendance{% endblock %}

{% block content %}
<section class="attendance-shell attendance-shell--visual">
  <div class="attendance-card attendance-card--dark">
    <h2>Mark Attendance</h2>

    <form method="POST">
      {% csrf_token %}
      <input type="text" name="ticket_id" id="ticket_id" class="form-control mb-3" placeholder="Enter Ticket ID" required>
      <button type="submit" class="btn btn-gradient w-100">Mark Attendance</button>
    </form>

    {% if success %}
      <p class="attendance-alert is-success mt-3">{{ message }}</p>
    {% elif error %}
      <p class="attendance-alert is-danger mt-3">{{ message }}</p>
    {% endif %}
  </div>
</section>
{% endblock %}
