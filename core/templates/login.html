{% extends 'base.html' %}
{% load static %}
{% block title %}Login - QrEntry{% endblock %}

{% block content %}
<section class="auth-shell auth-shell--compact">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="auth-card" data-aos="fade-up">
          <div class="text-center mb-4">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Login to manage your events and bookings.</p>
          </div>

          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <input type="text" class="form-control" id="username" name="username" placeholder="Username or email" required>
            </div>

            <div class="mb-3">
              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="forgot-password">
              <a href="{% url 'password_reset' %}">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold">Login</button>
          </form>

          <div class="text-center mt-3">
            <small class="text-white-50">Don't have an account?
              <a href="{% url 'signup' %}" class="auth-inline-link">Sign Up</a>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
