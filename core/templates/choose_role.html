{% extends 'base.html' %}
{% load static %}

{% block title %}Choose Role - QrEntry{% endblock %}

{% block content %}
<section class="auth-shell auth-shell--compact">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="auth-card text-center">
          <h2 class="auth-title mb-3">Choose Your Role</h2>
          <p class="auth-subtitle mb-4">You need to select your role to continue.</p>

          {% if error %}
            <p class="field-error text-start mb-3">{{ error }}</p>
          {% endif %}

          <form method="post" class="text-start role-choice-form">
            {% csrf_token %}
            <div class="mb-3">
              <input type="radio" id="organiser" name="role" value="organiser">
              <label for="organiser" class="text-white ms-2">Organiser</label>
            </div>
            <div class="mb-4">
              <input type="radio" id="participant" name="role" value="participant">
              <label for="participant" class="text-white ms-2">Participant</label>
            </div>
            <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold">Continue</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
