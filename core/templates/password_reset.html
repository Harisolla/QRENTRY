{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password - QrEntry{% endblock %}

{% block content %}
<section class="auth-shell auth-shell--compact">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-4">
        <div class="auth-card shadow-lg" data-aos="fade-up">
          <div class="text-center mb-4">
            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Enter your email to receive a reset link.</p>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <input type="email" class="form-control" name="email" placeholder="Email" required>
            </div>
            <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold">Send Link</button>
          </form>

          <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="auth-inline-link">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
