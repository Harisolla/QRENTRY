{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password - QrEntry{% endblock %}

{% block content %}
<style>
body {
    background: url("{% static 'images/signup-bg.png' %}") no-repeat center center fixed;
    background-size: cover;
}
.glass-card {
    background: rgba(20, 20, 20, 0.85);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
}
.glass-card .form-control {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
}
.btn-gradient {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    border: none;
}
.btn-gradient:hover {
    opacity: 0.9;
}
</style>

<section class="py-5 min-vh-95 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="glass-card shadow-lg" data-aos="fade-up">

          <div class="text-center mb-4">
            <h2 class="fw-bold text-white">Reset Password</h2>
            <p class="small text-white-50">Enter your email to receive a reset link</p>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <input type="email" class="form-control" name="email" placeholder="Email" required>
            </div>
            <button type="submit" class="btn btn-gradient w-50 mx-auto d-block py-2 fw-bold">Send Link</button>
          </form>

          <div class="text-center mt-3">
            <small class="text-white-50">
              <a href="{% url 'login' %}" class="text-white fw-bold">Back to Login</a>
            </small>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
