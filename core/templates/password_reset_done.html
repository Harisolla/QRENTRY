{% extends 'base.html' %}
{% load static %}
{% block title %}Check Email - QrEntry{% endblock %}

{% block content %}
<section class="auth-shell auth-shell--compact">
  <div class="container">
    <div class="auth-message-card text-center mx-auto">
      <h2 class="auth-title">Check Your Email</h2>
      <p class="auth-subtitle mb-4">A password reset link has been sent if the email exists in our system.</p>
      <a href="{% url 'login' %}" class="btn btn-gradient">Back to Login</a>
    </div>
  </div>
</section>
{% endblock %}
